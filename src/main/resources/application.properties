spring.jpa.show-sql=true

# ------ Versioning settings
#spring.mvc.apiversion.use.path-segment=0
#spring.mvc.apiversion.use.query-parameter=version
#spring.mvc.apiversion.use.header=X-API-VERSION
#In hedaer we need to pass Accept:application/json;version=1.0.0
#spring.mvc.apiversion.use.media-type-parameter[application/json]=version

spring.profiles.active=dev
#management.endpoints.web.exposure.include=health,info,env,beans,metrics,loggers
management.endpoints.web.exposure.include=*


#---------- MYSQL ----------
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/restful_web_service
spring.datasource.username=restful_app
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#---------- MYSQL ----------

#----------- SPRING SECURITY ---------------
spring.security.user.name=user
spring.security.user.password=myownPassword